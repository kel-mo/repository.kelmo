name: Publish repository to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify addons.xml and zips
        run: |
          python3 - <<'PY'
          import hashlib, os, sys, xml.etree.ElementTree as ET
          def check(path):
              want = open(path + '.sha256').read().split()[0]
              if hashlib.sha256(open(path, 'rb').read()).hexdigest() != want:
                  sys.exit(path + '.sha256 does not match')
          check('zips/addons.xml')
          for a in ET.fromstring(open('zips/addons.xml', 'rb').read()).findall('addon'):
              z = 'zips/{0}/{0}-{1}.zip'.format(a.get('id'), a.get('version'))
              if not os.path.isfile(z):
                  sys.exit('missing ' + z)
              check(z)
          print('ok')
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: zips

      - id: deployment
        uses: actions/deploy-pages@v5
